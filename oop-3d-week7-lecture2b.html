<script>
window.OOP3D = (() => {
"use strict";
const stage = document.getElementById("stage"), frame = document.getElementById("frame");
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = (ms) => (RM ? 1 : ms);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function el(parent, cls, html) { const e = document.createElement("div"); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, p = Math.abs(f);
  const ch = (v) => Math.round(v + (t - v) * p);
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}
const COL = { Device: "#4B2E83", Software: "#6E52B5", Network: "#1B7F5A", Data: "#C9761F", People: "#AC3B2A" };
const tagsHTML = (a) => (a || []).map((t) => `<span class="tag t-${t.toLowerCase()}">${t}</span>`).join("");
let lastDrag = 0;

// ---------------- 3D world ----------------
// Ground coordinates: x runs left to right, y runs towards the viewer, z is height above the ground.
function World(root, rect, cls) {
  const vp = el(root, "vp" + (cls ? " " + cls : ""));
  Object.assign(vp.style, { left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px" });
  const world = el(vp, "world");
  const timers = [], anims = [];
  let camNow = { x: 0, y: 0, s: 1, rx: 56, rz: 16, px: 0, py: 50 }, orbit = { rz: 0, rx: 0 };
  const W = { vp, world };

  function applyCam() {
    const c = camNow, rx = Math.max(15, Math.min(82, c.rx + orbit.rx)), rz = c.rz + orbit.rz;
    world.style.setProperty("--rx", rx + "deg");
    world.style.setProperty("--rz", rz + "deg");
    world.style.transform = `translate3d(${c.px}px,${c.py}px,0) scale(${c.s}) rotateX(${rx}deg) rotateZ(${rz}deg) translate3d(${-c.x}px,${-c.y}px,0)`;
  }
  W.cam = (c, instant) => {
    camNow = Object.assign({ x: 0, y: 0, s: 1, rx: 56, rz: 16, px: 0, py: 50 }, c); orbit = { rz: 0, rx: 0 };
    if (instant) world.classList.add("nt");
    applyCam();
    if (instant) { void world.offsetWidth; world.classList.remove("nt"); }
  };
  // drag to look around
  let drag = null;
  vp.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, rz: orbit.rz, rx: orbit.rx, moved: false }; try { vp.setPointerCapture(e.pointerId); } catch (err) {} });
  vp.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
    if (!drag.moved) return;
    orbit.rz = drag.rz - dx * 0.25; orbit.rx = drag.rx - dy * 0.2;
    world.classList.add("nt"); applyCam();
  });
  const endDrag = () => { if (!drag) return; if (drag.moved) lastDrag = Date.now(); drag = null; void world.offsetWidth; world.classList.remove("nt"); };
  vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

  const tf = (b, p) => `translate3d(${p.x - b._w / 2}px,${p.y - b._d / 2}px,${p.z}px) scale3d(1,1,${b._g})`;
  const place = (b) => { b.style.transform = tf(b, b._p); };

  W.ground = (x, y, w, h) => { const g = el(world, "ground"); g.style.cssText += `width:${w}px;height:${h}px;transform:translate3d(${x}px,${y}px,0);`; return g; };
  W.plate = (x, y, w, d, cls, html, parent) => { const e = el(parent || world, "plate " + (cls || ""), html || ""); e.style.cssText += `width:${w}px;height:${d}px;transform:translate3d(${x - w / 2}px,${y - d / 2}px,2px);`; return e; };
  W.strip = (x1, y1, x2, y2, o) => {

// ---------------- the code panel ----------------
// A dark panel of Python drawn on top of the slide, with lines that light up as they run.
//   const c = code(root, `class A:\n    pass`, { x: 64, y: 128, w: 520, fs: 18, title: "savings.py" });
//   c.hl([3, 4])        light lines 3 and 4 (1-based); c.hl([]) clears that colour
//   c.hl([5], "bad")    mark line 5 red; "good" marks green; "dim" greys lines out
//   c.clear()           removes every mark;  c.line(5, "new text") replaces a line
//   c.el is the panel element: W.show(c.el, on) hides or shows it
// one pass, so a word inside a span this function just wrote is never coloured again
const TOK = /(@\w+)|\b(class|def|return|if|elif|else|for|in|while|not|and|or|is|pass|raise|import|from|try|except|as|with|lambda|None|True|False|self|super)\b|\b(\d+(?:\.\d+)?)\b/g;
function pyHTML(line) {
  let h = esc(line), cm = "";
  const ci = h.search(/#(?=(?:[^"']|"[^"]*"|'[^']*')*$)/);
  if (ci >= 0) { cm = `<span class="cm">${h.slice(ci)}</span>`; h = h.slice(0, ci); }
  const parts = h.split(/("[^"]*"|'[^']*')/);
  h = parts.map((p, i) => (i % 2 ? `<span class="st">${p}</span>` : p.replace(TOK, (m, dec, kw, num) => `<span class="${dec ? "dec" : kw ? "kw" : "nm"}">${m}</span>`))).join("");
  return h + cm;
}
function code(root, src, o) {
  o = o || {};
  const c = { el: el(root, "ov code" + (o.cls ? " " + o.cls : "")) };
  c.el.style.cssText = `left:${o.x == null ? 64 : o.x}px;top:${o.y == null ? 128 : o.y}px;width:${o.w || 520}px;font-size:${o.fs || 18}px;` + (o.style || "");
  if (o.title) el(c.el, "cttl", esc(o.title));
  c.ln = src.replace(/\n$/, "").split("\n").map((t) => el(c.el, "ln", pyHTML(t) || " "));
  c.hl = (nums, cls) => { cls = cls || "on"; c.ln.forEach((l, i) => l.classList.toggle(cls, (nums || []).includes(i + 1))); };
  c.clear = () => c.ln.forEach((l) => l.classList.remove("on", "bad", "good", "dim"));
  c.line = (n, t) => { if (c.ln[n - 1]) c.ln[n - 1].innerHTML = pyHTML(t) || " "; };
  return c;
}

// ---------------- 24 and 25. Practice and verdicts: a hospital system ----------------
const HOSP = [
  { a: "Ambulance", b: "Vehicle", ctx: "in the hospital's fleet app, beside Car and Van", ok: true, test: "All three pass", fix: "An ambulance is driven, serviced and fuelled like every vehicle", kind: "isa", short: "is-a" },
  { a: "Prescription", b: "LabReport", ctx: "so it can reuse print_letterhead()", test: "Sentence, wants everything", fix: "Letterhead class that both hold (Case 1)", kind: "share", short: "has-a" },
  { a: "PatientWaitingList", b: "list", ctx: "patients are seen in arrival order", test: "Wants everything", fix: "Hold a list inside; offer add() and next_patient() (Case 2)", kind: "hold", short: "has-a" },
  { a: "Cardiologist", b: "Doctor", ctx: "…plus 30 more specialties, identical except for the name", n30: true, test: "Differ only in data", fix: "One Doctor class with a specialty field (Case 3)", kind: "data", short: "data" },
  { a: "HeadNurse", b: "Nurse", ctx: "nurses are often promoted to head nurse", test: "Promotion changes it", fix: "Nurse has a role; promote() changes it (Case 5)", kind: "role", short: "has-a" },
  { a: "AppointmentNotFound", b: "NotFoundError", ctx: "added to the API's error hierarchy", ok: true, test: "All three pass", fix: "A kind of not-found error; same 404 handling (Case 9)", kind: "isa", short: "is-a" }
];
const HX = [0, 500, 1000], HY = [-130, 210];
function hospScene(W, solved) {
  W.ground(-320, -360, 1640, 760);
  return HOSP.map((p, i) => {
    const x = HX[i % 3], y = HY[Math.floor(i / 3)], P = { x, y };
    const fs = (t) => (t.length > 16 ? 16 : 19);
    P.A = W.box({ x: x - 120, y, w: 220, d: 60, h: 60, c: "#036672", front: `<div class="ftxt mono" style="font-size:${fs(p.a)}px">${p.a}${p.n30 ? " ×30" : ""}</div>` });
    P.B = W.box({ x: x + 120, y, w: 220, d: 60, h: 60, c: GREY, front: `<div class="ftxt mono" style="font-size:${fs(p.b)}px">${p.b}</div>` });
    P.q = W.bb({ x, y, z: 100, html: `<span class="lab big" style="font-size:24px;padding:6px 20px">${i + 1}  ?</span>` });
    if (solved) {
      W.show(P.q, false);
      const glass = (gx, title, inner, ic) => {
        const g = W.grp(gx, y, 0, "hide");
        W.box({ w: 230, d: 120, h: 110, c: MID, cls: "glass", top: `<div class="ftxt dark mono" style="font-size:${fs(title)}px">${title}</div>` }, g);
        W.box({ y: 10, z: 4, w: 170, d: 44, h: 54, c: ic || AMB, front: `<div class="ftxt mono" style="font-size:18px">${inner}</div>` }, g);
        return g;
      };
      P.g = [];
      if (p.kind === "share") P.g = [glass(x - 120, "Prescription", "Letterhead"), glass(x + 120, "LabReport", "Letterhead")];
      if (p.kind === "hold") P.g = [glass(x, "PatientWaitingList", "list")];
      if (p.kind === "data") P.g = [glass(x - 120, "a Doctor", "specialty", "#FFFFFF")];
      if (p.kind === "role") P.g = [glass(x, "Nurse", "Role", GRN)];
      if (p.kind === "data") P.g[0].lastChild.front.firstChild.classList.add("dark");
      // the right column's label is pulled in so it stays on screen on the overview
      P.short = W.bb({ x: x - (i % 3 === 2 ? 100 : 0), y: y + 60, z: 150, cls: "hide", html: `<span class="lab ${p.ok ? "good" : "bad"}" style="font-size:24px;padding:6px 18px">${i + 1} · ${p.ok ? "Right" : "Wrong"}</span>` });
      P.v = W.bb({ x: x, y: y - 40, z: 180, cls: "hide", html: `<span class="lab big ${p.ok ? "good" : "bad"}" style="font-size:26px">${i + 1} · ${p.ok ? "Right" : "Wrong"}: ${p.test}</span>` });
    }
    return P;
  });
}

S.verdicts = (root) => {
  const W = world3(root);
  const P = hospScene(W, true);
  const card = tcard(root, 40, 120, 620);
  card.style.fontSize = "17px"; card.style.padding = "12px 16px";
  card.innerHTML = `<table class="ptb"><tr><th></th><th>Line · verdict · test that decides</th><th>Fix / reason</th></tr>${HOSP.map((p, i) => `<tr><td class="n">${i + 1}</td><td><code>${p.a}(${p.b})${p.n30 ? " × 30" : ""}</code><br><span class="${p.ok ? "v-ok" : "v-no"}">${p.ok ? "Right" : "Wrong"}</span> · ${p.test}</td><td>${p.fix}</td></tr>`).join("")}</table>`;
  const trs = [...card.querySelectorAll("tr")].slice(1);
  const caps = HOSP.map((p, i) => `${i + 1}. ${p.a}(${p.b}): ${p.ok ? "Right" : "Wrong"}. ${p.test === "All three pass" ? "All three tests pass" : `Decided by: ${p.test.toLowerCase()}`}. ${p.fix}.`);
  caps[0] = `1. Ambulance(Vehicle): Right, all three tests pass. An ambulance is driven, serviced and fuelled like every vehicle, and adds its own things: a siren, an equipment check.`;
  caps[4] = `5. HeadNurse(Nurse): Wrong. It would look fine on day one and break on the first promotion, exactly Case 5. Nurse has a role; promote() changes it.`;
  caps.push(`Every line matched a case from today. Ask "which case does this look like?"`);
  return { n: 7, W, go(step, fwd) {
    W.clear();
    trs.forEach((t, i) => { t.className = step === 6 ? "" : i > step ? "off" : i === step ? "now" : "past"; });
    P.forEach((o, i) => {
      const p = HOSP[i], done = step >= i, now = step === i && fwd;
      W.show(o.v, step === i); W.show(o.short, step === 6);
      [o.A, o.B, ...o.g].forEach((b) => b.classList.toggle("dim", step < 6 && done && step !== i));
      if (p.kind === "isa") {
        W.show(o.A, true); W.show(o.B, true);
        if (done) { W.put(o.B, o.x, o.y, 0); if (now) { W.put(o.A, o.x - 120, o.y, 0); W.fly(o.A, [[o.x - 60, o.y, 130], [o.x, o.y, 60]], 1300, true, 300); } else W.put(o.A, o.x, o.y, 60); }
        else { W.put(o.A, o.x - 120, o.y, 0); W.put(o.B, o.x + 120, o.y, 0); }
        return;
      }
      W.put(o.A, o.x - 120, o.y, 0); W.put(o.B, o.x + 120, o.y, 0);
      W.show(o.A, !done || p.kind === "never"); W.show(o.B, !done || p.kind === "data");
      o.g.forEach((g) => W.show(g, done));
      if (p.kind === "data" && done) W.put(o.B, o.x + 120, o.y, 0);
    });
    if (step < 6) { const o = P[step]; W.cam({ x: o.x, y: o.y, s: .9, rz: 6, px: 330, py: 200 }); }
    else W.cam({ x: 540, y: 40, s: .42, rz: 6, px: 330, py: 120 });
    return { cap: caps[step], ck: step === 6 ? "good" : HOSP[step].ok ? "good" : "bad" };
  } };
};
