<script>
window.OOP3D = (() => {
"use strict";
const stage = document.getElementById("stage"), frame = document.getElementById("frame");
const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = (ms) => (RM ? 1 : ms);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function el(parent, cls, html) { const e = document.createElement("div"); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, p = Math.abs(f);
  const ch = (v) => Math.round(v + (t - v) * p);
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}
const COL = { Device: "#4B2E83", Software: "#6E52B5", Network: "#1B7F5A", Data: "#C9761F", People: "#AC3B2A" };
const tagsHTML = (a) => (a || []).map((t) => `<span class="tag t-${t.toLowerCase()}">${t}</span>`).join("");
let lastDrag = 0;

// ---------------- 3D world ----------------
// Ground coordinates: x runs left to right, y runs towards the viewer, z is height above the ground.
function World(root, rect, cls) {
  const vp = el(root, "vp" + (cls ? " " + cls : ""));
  Object.assign(vp.style, { left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px" });
  const world = el(vp, "world");
  const timers = [], anims = [];
  let camNow = { x: 0, y: 0, s: 1, rx: 56, rz: 16, px: 0, py: 50 }, orbit = { rz: 0, rx: 0 };
  const W = { vp, world };

  function applyCam() {
    const c = camNow, rx = Math.max(15, Math.min(82, c.rx + orbit.rx)), rz = c.rz + orbit.rz;
    world.style.setProperty("--rx", rx + "deg");
    world.style.setProperty("--rz", rz + "deg");
    world.style.transform = `translate3d(${c.px}px,${c.py}px,0) scale(${c.s}) rotateX(${rx}deg) rotateZ(${rz}deg) translate3d(${-c.x}px,${-c.y}px,0)`;
  }
  W.cam = (c, instant) => {
    camNow = Object.assign({ x: 0, y: 0, s: 1, rx: 56, rz: 16, px: 0, py: 50 }, c); orbit = { rz: 0, rx: 0 };
    if (instant) world.classList.add("nt");
    applyCam();
    if (instant) { void world.offsetWidth; world.classList.remove("nt"); }
  };
  // drag to look around
  let drag = null;
  vp.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, rz: orbit.rz, rx: orbit.rx, moved: false }; try { vp.setPointerCapture(e.pointerId); } catch (err) {} });
  vp.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
    if (!drag.moved) return;
    orbit.rz = drag.rz - dx * 0.25; orbit.rx = drag.rx - dy * 0.2;
    world.classList.add("nt"); applyCam();
  });
  const endDrag = () => { if (!drag) return; if (drag.moved) lastDrag = Date.now(); drag = null; void world.offsetWidth; world.classList.remove("nt"); };
  vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

  const tf = (b, p) => `translate3d(${p.x - b._w / 2}px,${p.y - b._d / 2}px,${p.z}px) scale3d(1,1,${b._g})`;
  const place = (b) => { b.style.transform = tf(b, b._p); };

  W.ground = (x, y, w, h) => { const g = el(world, "ground"); g.style.cssText += `width:${w}px;height:${h}px;transform:translate3d(${x}px,${y}px,0);`; return g; };
  W.plate = (x, y, w, d, cls, html, parent) => { const e = el(parent || world, "plate " + (cls || ""), html || ""); e.style.cssText += `width:${w}px;height:${d}px;transform:translate3d(${x - w / 2}px,${y - d / 2}px,2px);`; return e; };
  W.strip = (x1, y1, x2, y2, o) => {
    o = o || {}; const len = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI, w = o.w || 10;
    const e = el(o.parent || world, "strip " + (o.cls || ""));

// ---------------- the code panel ----------------
// A dark panel of Python drawn on top of the slide, with lines that light up as they run.
//   const c = code(root, `class A:\n    pass`, { x: 64, y: 128, w: 520, fs: 18, title: "savings.py" });
//   c.hl([3, 4])        light lines 3 and 4 (1-based); c.hl([]) clears that colour
//   c.hl([5], "bad")    mark line 5 red; "good" marks green; "dim" greys lines out
//   c.clear()           removes every mark;  c.line(5, "new text") replaces a line
//   c.el is the panel element: W.show(c.el, on) hides or shows it
// one pass, so a word inside a span this function just wrote is never coloured again
const TOK = /(@\w+)|\b(class|def|return|if|elif|else|for|in|while|not|and|or|is|pass|raise|import|from|try|except|as|with|lambda|None|True|False|self|super)\b|\b(\d+(?:\.\d+)?)\b/g;
function pyHTML(line) {
  let h = esc(line), cm = "";
  const ci = h.search(/#(?=(?:[^"']|"[^"]*"|'[^']*')*$)/);
  if (ci >= 0) { cm = `<span class="cm">${h.slice(ci)}</span>`; h = h.slice(0, ci); }
  const parts = h.split(/("[^"]*"|'[^']*')/);
  h = parts.map((p, i) => (i % 2 ? `<span class="st">${p}</span>` : p.replace(TOK, (m, dec, kw, num) => `<span class="${dec ? "dec" : kw ? "kw" : "nm"}">${m}</span>`))).join("");
  return h + cm;
}
function code(root, src, o) {
  o = o || {};
  const c = { el: el(root, "ov code" + (o.cls ? " " + o.cls : "")) };
  c.el.style.cssText = `left:${o.x == null ? 64 : o.x}px;top:${o.y == null ? 128 : o.y}px;width:${o.w || 520}px;font-size:${o.fs || 18}px;` + (o.style || "");
  if (o.title) el(c.el, "cttl", esc(o.title));
  c.ln = src.replace(/\n$/, "").split("\n").map((t) => el(c.el, "ln", pyHTML(t) || " "));
  c.hl = (nums, cls) => { cls = cls || "on"; c.ln.forEach((l, i) => l.classList.toggle(cls, (nums || []).includes(i + 1))); };
  c.clear = () => c.ln.forEach((l) => l.classList.remove("on", "bad", "good", "dim"));
  c.line = (n, t) => { if (c.ln[n - 1]) c.ln[n - 1].innerHTML = pyHTML(t) || " "; };
  return c;
}

    document.getElementById("next").disabled = si === DECK.slides.length - 1 && step === scene.n - 1;
    try { history.replaceState(null, "", "#s" + (si + 1)); } catch (e) {}
  }
  function goSlide(i, atEnd) {
    if (i < 0 || i >= DECK.slides.length) return;
    si = i; build(i); step = atEnd ? scene.n - 1 : 0;
    render(false);
  }
  function next() { if (step < scene.n - 1) { step++; render(true); } else goSlide(si + 1, false); }
  function prev() { if (step > 0) { step--; render(false); } else goSlide(si - 1, true); }

  const jump = document.getElementById("jump");
  DECK.slides.forEach((s, k) => { const o = document.createElement("option"); o.value = String(k); o.textContent = (k + 1) + ". " + s.t; jump.appendChild(o); });
  jump.addEventListener("change", () => goSlide(+jump.value, false));
  document.getElementById("next").addEventListener("click", next);
  document.getElementById("prev").addEventListener("click", prev);
  document.getElementById("again").addEventListener("click", () => goSlide(si, false));
  document.getElementById("full").addEventListener("click", () => { const r = frame.requestFullscreen && frame.requestFullscreen(); if (r && r.catch) r.catch(() => {}); });
  // the OOP decks are for students: no speaker notes, no notes button
  document.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT")) return;
    if (["ArrowRight", "PageDown", " ", "Enter", "ArrowDown"].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace", "ArrowUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "f" || e.key === "F") document.getElementById("full").click();
    else if (e.key === "Home") goSlide(0, false);
    else if (e.key === "End") goSlide(DECK.slides.length - 1, false);
  });
  stage.addEventListener("click", () => { if (document.fullscreenElement === frame && Date.now() - lastDrag > 350) next(); });
  function fit() {
    const full = document.fullscreenElement === frame;
    const w = full ? window.innerWidth : frame.clientWidth;
    // outside full screen, keep the slide and the button row inside the window together
    // (a phone held sideways is wide but short, so the width alone would push the buttons off screen)
    const ctl = document.querySelector(".controls");
    const room = window.innerHeight - (ctl ? ctl.offsetHeight : 0) - 24;
    const h = full ? window.innerHeight : Math.min(w * 720 / 1280, Math.max(room, 200));
    const s = Math.min(w / 1280, h / 720);
    stage.style.transform = `scale(${s})`;
    stage.style.left = (w - 1280 * s) / 2 + "px";
    if (full) stage.style.top = (h - 720 * s) / 2 + "px";
    else { stage.style.top = "0px"; frame.style.height = 720 * s + "px"; }
  }
  window.addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", fit);
  fit();
  let start = 0;
  try { const m = /^#s(\d+)$/.exec(location.hash); if (m) start = Math.min(DECK.slides.length - 1, Math.max(0, +m[1] - 1)); } catch (e) {}
  goSlide(start, false);
  window.__deck = { next, prev, goSlide, get pos() { return [si, step, scene.n]; }, count: DECK.slides.length };
}

return { World, S, VP, run, el, esc, shade, tagsHTML, T, css, code, pyHTML };
})();

    `Blob(): Python checks at the door. area is still abstract, so Blob is stopped before any object exists.`,
    `This one Python really does enforce, and it fails at the moment the object is built, not later when a method is called.`,
    `Use duck typing in your own small programs. Use an abstract base class when other people will write the subclasses.`
  ];
  return { n: 6, W, go(step, fwd) {
    W.clear(); shape.reset(); blob.reset(); c.clear();
    c.hl(step === 0 ? [1] : step === 1 ? [2, 3, 4] : step === 2 ? [5, 6] : []);
    if (step >= 3) c.hl([7], "bad");
    W.show(shape, step >= 1); shape.classList.toggle("hide", step < 1);
    W.show(blob, step >= 2); blob.classList.toggle("hide", step < 2);
    W.show(absL, step === 1);
    W.show(noArea, step === 2);
    if (step >= 3) shape.mark("area", "bad");
    W.show(door.bar, false); W.show(err, false);
    W.show(ball, step === 3 || step === 4);
    if (step >= 3) {
      ball.say("Blob()");
      W.put(ball, ...blob.at("x"));
      W.fly(ball, [[DX, DY - 80, 60], [DX, DY - 22, 60]], 1800, fwd && step === 3, 300);
      at(W, fwd && step === 3, 2100, () => { ball.say(""); W.show(door.bar, true); W.show(err, true); });
    }
    W.show(doorL, step === 0);
    W.show(noObj, step === 4);
    W.show(advice, step === 5);
    W.cam(step === 3 ? { x: 100, y: 110, s: .95, rz: 6, px: 300, py: 95 } : { x: 60, y: 110, s: .85, rz: 6, px: 320, py: 70 });
    return { cap: caps[step], ck: step === 3 ? "bad" : step >= 4 ? "good" : "" };
  } };
};

// ---------------- Problem 16 solution ----------------
const SEND_SRC = `class SmsSender:
    def send(self, message):
        print("SMS:", message)
class EmailSender:
    def send(self, message):
        print("Email:", message)
class PigeonSender:
    pass
for s in [SmsSender(), EmailSender(), PigeonSender()]:
    s.send("Fee due")`;
const SEND_ABC = `from abc import ABC, abstractmethod
class Sender(ABC):
    @abstractmethod
    def send(self, message): ...
class SmsSender(Sender):
    def send(self, message):
        print("SMS:", message)
class EmailSender(Sender):
    def send(self, message):
        print("Email:", message)
class PigeonSender(Sender):
    pass
for s in [SmsSender(), EmailSender(), PigeonSender()]:
    s.send("Fee due")`;
const OUT_LINES = ["SMS: Fee due", "Email: Fee due", "AttributeError: 'PigeonSender' object has no attribute 'send'"];

S.solution = (root) => {
  const W = World(root, VP);
  W.ground(-440, -280, 880, 820);
  const cP = code(root, SEND_SRC, { x: 40, y: 122, w: 560, fs: 15, title: "senders.py, plain duck typing" });
  const out = code(root, OUT_LINES.join("\n"), { x: 40, y: 410, w: 575, fs: 15, cls: "out", title: "Output" });
  const cA = code(root, SEND_ABC, { x: 40, y: 122, w: 560, fs: 15, title: "senders.py, with an abstract base class" });
  const xs = [-250, 0, 250], CY = -170, SY = 220, DY = 60;
  const parent = W.cabinet(0, CY, { name: "Sender(ABC)", drawers: ["send"], w: 760, dfs: 24, fs: 24 });
  parent.dr.send.classList.add("abs", "lefttxt");
  const names = ["SmsSender", "EmailSender", "PigeonSender"];
  const cabs = names.map((n, i) => W.cabinet(xs[i], CY, { name: n, drawers: i < 2 ? ["send"] : [], w: 220, dfs: 24, fs: 24, c: "#0A8F8A" }));
  const door = factoryDoor(W, 0, DY, null, 100);
  // each object stands in front of its own class; the student it writes to stands beside it
  const objs = names.map((n, i) => W.obj(xs[i], SY, { slots: [], w: 150, d: 70 }));
  xs.forEach((x) => W.person(x + 100, SY + 10, "#036672"));
  const got = xs.map((x) => W.bb({ x: x + 100, y: SY + 10, z: 96, cls: "hide", html: "" }));
  const ball = W.ball();
  const errA = burst(W, 200, CY, 125, `AttributeError: 'PigeonSender'<br>object has no attribute 'send'`, 23);
  const noMsg = W.bb({ x: -60, y: SY, z: 110, cls: "hide", html: lab("no message sent to anyone", "warn", 22) });
  const errT = burst(W, 120, SY + 150, 0, `TypeError: Can't instantiate<br>abstract class PigeonSender<br>without an implementation for<br>abstract method 'send'`, 21);
  const veil = el(root, "ov veil"); veil.style.cssText = "left:620px;top:112px;width:660px;height:484px;";
  const card = el(root, "ov card cons", `<h4 style="color:var(--red)">What happens</h4>Two messages are sent successfully. Then AttributeError, halfway through the loop, with the work half done.
    <h4 style="color:var(--green)">With an abstract base class</h4>PigeonSender() fails the moment it is built. No message is sent, and the list is never even assembled.
    <div class="bottom">Both versions fail. The difference is when. In a real system, failing after sending two of three notifications is far harder to recover from than failing before sending any.</div>`);
  card.style.cssText = "left:650px;top:128px;width:590px;font-size:19px;";
  const say = (i, html) => { got[i].in.innerHTML = html; W.show(got[i], !!html); };
  const caps = [
    `Plain duck typing: three classes and no parent. PigeonSender has no send method at all.`,
    `The list is built first. All three objects are built without a word: nothing checks for a send method.`,
    `s is the SmsSender. s.send("Fee due") finds send in SmsSender: SMS: Fee due. The first student has the reminder.`,
    `s is the EmailSender: Email: Fee due. The second student has it too.`,
    `s is the PigeonSender. The ball finds no send drawer: AttributeError, halfway through the loop.`,
    `Two messages are sent successfully, then the crash. A fee reminder went to two students and not the third, with the work half done.`,
    `Now with an abstract base class. Sender(ABC) promises send, and each sender is built on top of it.`,
    `The list is built first. SmsSender() and EmailSender() pass the door. PigeonSender() fails the moment it is built.`,
    `No message is sent, and the list is never even assembled. Nothing happened, so nothing is half done.`,
    `Both versions fail. The difference is when.`
  ];
  // the ball builds objects one by one; with stopAt, that one is stopped at the door
  const build = (fwd, stopAt) => {
    const T = 1700;
    names.forEach((n, i) => {
      if (i > stopAt) return;
      const go = () => {
        ball.say(n + "()");
        W.put(ball, ...cabs[i].at("x"));
        const pts = i === stopAt ? [[0, DY - 80, 60], [0, DY - 22, 60]] : stopAt > 2 ? [[xs[i], SY + 60, 60]] : [[0, DY - 80, 60], [0, DY + 20, 60], [xs[i], SY + 60, 60]];
        W.fly(ball, pts, i === stopAt ? 1100 : T, fwd, 0);
      };
      const done = () => { if (i === stopAt) { ball.say(""); W.show(door.bar, true); W.show(errT, true); } else W.show(objs[i], true); };
      if (fwd) { W.later(go, 300 + i * (T + 200)); W.later(done, 300 + i * (T + 200) + (i === stopAt ? 1150 : T)); }
      else { if (i === stopAt) go(); done(); }
    });
  };
  return { n: 10, W, go(step, fwd) {
    W.clear(); parent.reset(); cabs.forEach((g) => g.reset()); cP.clear(); cA.clear(); out.clear();
    const abc = step >= 6;
    W.show(cP.el, !abc); W.show(out.el, !abc); W.show(cA.el, abc);
    W.show(parent, abc); parent.classList.toggle("hide", !abc);
    W.show(door, abc); door.classList.toggle("hide", !abc);
    cabs.forEach((g, i) => W.moveGrp(g, xs[i], CY, abc ? parent.top : 0));
    W.show(door.bar, false); W.show(errA, false); W.show(errT, false);
    objs.forEach((o) => { W.show(o, false); o.classList.remove("dim"); });
    [0, 1, 2].forEach((i) => say(i, ""));
    W.show(ball, false); W.show(noMsg, false);
    W.show(veil, step === 9); W.show(card, step === 9);
    // printed output
    const printed = !abc ? Math.max(0, Math.min(step, 5) - 1) : 0;
    OUT_LINES.forEach((t, i) => out.line(i + 1, i < printed ? t : ""));
    if (!abc) {
      cP.hl(step === 0 ? [1, 2, 3, 4, 5, 6, 7, 8] : step === 1 ? [9] : step === 2 ? [10, 2, 3] : step === 3 ? [10, 5, 6] : []);
      if (step >= 4) cP.hl([10], "bad");
      if (step >= 4) out.hl([3], "bad");
      if (step === 1) {
        if (fwd) { W.show(ball, true); W.later(() => W.show(ball, false), 300 + 3 * 1900 - 150); }
        build(fwd, 99);
      }
      if (step >= 2) objs.forEach((o) => W.show(o, true));
      const who = step >= 2 && step <= 4 ? step - 2 : -1;
      if (step >= 3) { cabs[0].open("send", true); cabs[0].mark("send", "hit"); say(0, lab("✓ Fee due", "good", 24)); }
      if (step >= 4) { cabs[1].open("send", true); cabs[1].mark("send", "hit"); say(1, lab("✓ Fee due", "good", 24)); }
      if (step >= 5) { W.show(errA, true); say(2, lab("✗ nothing", "bad", 24)); }
      if (who >= 0) {
        W.show(ball, true);
        ball.say(`s.send("Fee due")`);
        W.put(ball, xs[who], SY + 100, 110);
        const pts = [objs[who].at(), cabs[who].at(who < 2 ? "send" : "x")];
        W.fly(ball, pts, 2200, fwd, 300);
        if (fwd) out.line(who + 1, "");
        at(W, fwd, 2600, () => {
          if (who < 2) { W.show(ball, false); cabs[who].open("send", true); cabs[who].mark("send", "hit"); say(who, lab("✓ Fee due", "good", 24)); out.hl([who + 1], "good"); }
          else { W.show(ball, false); W.show(errA, true); say(2, lab("✗ nothing", "bad", 24)); }
          out.line(who + 1, OUT_LINES[who]);
        });
      }
      objs.forEach((o, i) => o.classList.toggle("dim", who >= 0 && i !== who));
    } else {
      cA.hl(step === 6 ? [2, 3, 4, 5, 8, 11] : []);
      if (step >= 7) cA.hl([13], "bad");
      if (step >= 8) cA.hl([14], "dim");
      if (step >= 7) { W.show(ball, true); build(fwd && step === 7, 2); }
      if (step >= 8) { objs.forEach((o, i) => o.classList.toggle("dim", i < 2)); W.show(noMsg, true); }
    }
    let cam = { x: 100, y: 60, s: .78, rz: 4, px: 330, py: 40 };
    if (step >= 2 && step <= 4) cam = { x: xs[step - 2] * .35 + 70, y: 60, s: .9, rz: 4, px: 330, py: 50 };
    if (step === 7 || step === 8) cam = { x: 100, y: 110, s: .9, rz: 4, px: 330, py: 52 };
    W.cam(cam);
    return { cap: caps[step], ck: step === 4 || step === 5 ? "bad" : step === 7 ? "warn" : step === 9 ? "good" : step === 8 ? "good" : "" };
  } };
};

  } };
};
